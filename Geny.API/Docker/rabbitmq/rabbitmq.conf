# rabbitmq.conf
# Loads pre-defined exchanges, queues, and bindings from definitions.json
# on first boot. Wolverine will also AutoProvision its own topology, but
# having the vhost and admin user pre-created avoids a race condition on startup.

management.load_definitions = /etc/rabbitmq/definitions.json

# Increase message size limit to 32 MB (Wolverine default is fine, but good to be explicit)
max_message_size = 33554432

# Heartbeat (seconds) — keeps connections alive through NAT/firewalls
heartbeat = 60

# Log to stdout so Docker picks it up
log.console = true
log.console.level = info
